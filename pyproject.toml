[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrekit"
version = "0.1.1"
description = "Research and preliminary-design toolkit for liquid rocket engine simulation and CAD export."
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [
    { name = "Ibrahim Shahid" },
]
keywords = [
    "lre",
    "rocket",
    "engine",
    "nozzle",
    "injector",
    "chamber",
    "rao",
    "moc",
    "regenerative-cooling",
    "cad",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "CoolProp>=7.0",
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "optimistix==0.0.11",
    "equinox==0.13.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
cea = ["rocketcea>=1.2"]
cad = ["cadquery"]

[project.urls]
Homepage = "https://github.com/ibrahimshahid1/RaoRocketSim"
Repository = "https://github.com/ibrahimshahid1/RaoRocketSim"
Issues = "https://github.com/ibrahimshahid1/RaoRocketSim/issues"

[project.scripts]
lrekit = "lrekit.cli:main"
raosim = "raosim.cli:main"
RaoRocketSim = "raosim.cli:main"
RaoRocketSimLegacy = "raosim.cli:legacy_main"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["raosim*", "lrekit*"]

[tool.setuptools.package-data]
raosim = [
    "benchmark_data/cases/*.json",
    "benchmark_data/curves/*.csv",
]
